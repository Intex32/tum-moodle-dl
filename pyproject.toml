[project]
name = "tum-moodle-dl"
version = "0.1.0"
description = "Download TUM Moodle course contents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "rich>=15.0.0",
    "tomlkit>=0.15.2",
    "typer>=0.27.3",
]

[project.scripts]
tmdl = "tum_moodle_dl.cli:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
